---
controller_credential_types:
- name: PostgreSQL Application Database
  description: Plaintext Hiera database credentials for the local testdb PostgreSQL
    application role; migrate to Ansible Vault or an approved external secret manager.
  kind: cloud
  inputs:
    fields:
    - id: db_host
      type: string
      label: Database Host
      help_text: Hostname for the PostgreSQL server.
    - id: db_port
      type: string
      label: Database Port
      help_text: Port used to connect to PostgreSQL.
    - id: db_name
      type: string
      label: Database Name
      help_text: Application PostgreSQL database name.
    - id: db_user
      type: string
      label: Database User
      help_text: PostgreSQL role used by the application.
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: Password for the application PostgreSQL role.
    required:
    - db_host
    - db_port
    - db_name
    - db_user
    - db_password
  injectors:
    extra_vars:
      db_host: !unsafe '{{ db_host }}'
      db_port: !unsafe '{{ db_port }}'
      db_name: !unsafe '{{ db_name }}'
      db_user: !unsafe '{{ db_user }}'
      db_password: !unsafe '{{ db_password }}'
- name: Application Secret Key
  description: Plaintext Hiera application secret key; migrate to Ansible Vault or
    an approved external secret manager.
  kind: cloud
  inputs:
    fields:
    - id: secret_key
      type: string
      label: Application Secret Key
      secret: true
      help_text: Secret key used by the application runtime.
    required:
    - secret_key
  injectors:
    extra_vars:
      secret_key: !unsafe '{{ secret_key }}'
