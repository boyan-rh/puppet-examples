---
argument_specs:
  main:
    short_description: Install and manage a local PostgreSQL service
    description:
      - Configures the PGDG APT repository and manages a PostgreSQL service on Debian-family hosts.
    options:
      postgresql_version:
        type: str
        required: false
        default: "16"
        description: PostgreSQL major version used to derive server and contrib package names.
      profile_postgresql_secure_logging:
        type: bool
        required: false
        default: true
        description: Controls redaction of output from tasks that process AAP credential values.
      db_host:
        type: str
        required: true
        description: Database host injected by an AAP credential type.
      db_port:
        type: str
        required: true
        description: Database port injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
      db_user:
        type: str
        required: true
        description: Database user injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: Sensitive database password injected by an AAP credential type.
      secret_key:
        type: str
        required: true
        description: Sensitive application secret key injected by an AAP credential type.
