---
controller_credentials:
- name: PostgreSQL Application Database - profile_postgresql
  description: Plaintext Hiera database credentials for the local testdb PostgreSQL
    application role; migrate to Ansible Vault or an approved external secret manager.
  organization: Default
  credential_type: PostgreSQL Application Database
  update_secrets: true
  inputs:
    db_host: '{{ db_host }}'
    db_port: '{{ db_port }}'
    db_name: '{{ db_name }}'
    db_user: '{{ db_user }}'
    db_password: '{{ vault_db_password }}'
- name: Application Secret Key - profile_postgresql
  description: Plaintext Hiera application secret key; migrate to Ansible Vault or
    an approved external secret manager.
  organization: Default
  credential_type: Application Secret Key
  update_secrets: true
  inputs:
    secret_key: '{{ vault_secret_key }}'
