---
controller_credentials:
  - name: Encrypted Hiera HAProxy Statistics Authentication - profile_haproxy
    description: HAProxy statistics endpoint credentials stored as encrypted Hiera PKCS7 data; migrate to Ansible Vault or an approved external secret manager.
    organization: Default
    credential_type: Encrypted Hiera HAProxy Statistics Authentication
    update_secrets: true
    inputs:
      stats_user: "{{ stats_user }}"
      stats_password: "{{ vault_stats_password }}"
  - name: Encrypted Hiera HAProxy TLS Private Key - profile_haproxy
    description: HAProxy TLS private-key material or external secret reference currently represented by an unverified Hiera value; migrate the private key 
      through Ansible Vault or an approved external secret manager.
    organization: Default
    credential_type: Encrypted Hiera HAProxy TLS Private Key
    update_secrets: true
    inputs:
      ssl_private_key: "{{ vault_ssl_private_key }}"
