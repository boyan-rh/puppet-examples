---
- name: Install HAProxy packages
  ansible.builtin.package:
    name: "{{ [profile_haproxy_package_name, 'logrotate'] + profile_haproxy_extra_packages }}"
    state: present

- name: Ensure HAProxy group exists
  ansible.builtin.group:
    name: "{{ profile_haproxy_group }}"
    system: true
    state: present

- name: Ensure HAProxy user exists
  ansible.builtin.user:
    name: "{{ profile_haproxy_user }}"
    group: "{{ profile_haproxy_group }}"
    home: /var/lib/haproxy
    shell: /sbin/nologin
    system: true
    state: present

- name: Create HAProxy configuration directories
  ansible.builtin.file:
    path: "{{ item_profile_haproxy }}" # noqa: R114 - paths derive from role defaults, not user input
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0755"
    state: directory
  loop:
    - "{{ profile_haproxy_config_dir }}"
    - "{{ profile_haproxy_config_dir }}/conf.d"
  loop_control:
    loop_var: item_profile_haproxy

- name: Create HAProxy runtime directory
  ansible.builtin.file:
    path: /var/lib/haproxy
    owner: "{{ profile_haproxy_user }}"
    group: "{{ profile_haproxy_group }}"
    mode: "0750"
    state: directory

- name: Enable HAProxy SELinux network connections
  ansible.posix.seboolean:
    name: haproxy_connect_any
    persistent: true
    state: true
  when:
    - profile_haproxy_selinux_enabled
    - ansible_facts['os_family'] == 'RedHat'
