---
argument_specs:
  main:
    short_description: Install and configure the HAProxy load balancer
    description:
      - Deploys HAProxy configuration, backend fragments, firewall rules, and service lifecycle management.
    options:
      profile_haproxy_secure_logging:
        type: bool
        required: false
        default: true
        description: Hides tasks that process sensitive credential values from logs.
      profile_haproxy_config_dir:
        type: str
        required: false
        default: /etc/haproxy
        description: Directory containing HAProxy configuration fragments and error pages.
      profile_haproxy_config_file:
        type: str
        required: false
        default: /etc/haproxy/haproxy.cfg
        description: Main HAProxy configuration file path.
      profile_haproxy_user:
        type: str
        required: false
        default: haproxy
        description: System account used by HAProxy.
      profile_haproxy_group:
        type: str
        required: false
        default: haproxy
        description: System group used by HAProxy.
      profile_haproxy_extra_packages:
        type: list
        elements: str
        required: false
        default: []
        description: Additional OS packages to install with HAProxy.
      profile_haproxy_stats_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure the HAProxy statistics listener.
      profile_haproxy_stats_port:
        type: int
        required: false
        default: 9000
        description: TCP port for the HAProxy statistics listener.
      profile_haproxy_stats_uri:
        type: str
        required: false
        default: /haproxy-stats
        description: URI for the HAProxy statistics endpoint.
      profile_haproxy_global_maxconn:
        type: int
        required: false
        default: 4096
        description: Maximum concurrent HAProxy connections.
      profile_haproxy_client_timeout:
        type: str
        required: false
        default: 30s
        description: Client connection timeout.
      profile_haproxy_server_timeout:
        type: str
        required: false
        default: 30s
        description: Backend server connection timeout.
      profile_haproxy_connect_timeout:
        type: str
        required: false
        default: 5s
        description: Backend connection establishment timeout.
      profile_haproxy_retries:
        type: int
        required: false
        default: 3
        description: Number of backend connection retries.
      profile_haproxy_ssl_enabled:
        type: bool
        required: false
        default: false
        description: Whether to enable the HTTPS listener.
      profile_haproxy_ssl_cert_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing the HAProxy PEM certificate.
      profile_haproxy_ssl_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory reserved for the HAProxy TLS private key.
      profile_haproxy_ssl_ciphers:
        type: str
        required: false
        default: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
        description: OpenSSL cipher string for TLS listener connections.
      profile_haproxy_ssl_min_version:
        type: str
        required: false
        default: TLSv1.2
        description: Minimum TLS version accepted by HAProxy.
      profile_haproxy_log_server:
        type: str
        required: false
        default: 127.0.0.1
        description: Syslog server used by HAProxy.
      profile_haproxy_log_facility:
        type: str
        required: false
        default: local0
        description: Syslog facility used by HAProxy.
      profile_haproxy_log_level:
        type: str
        required: false
        default: info
        description: Syslog severity used by HAProxy.
      profile_haproxy_backends:
        type: dict
        required: false
        default:
          webservers:
            balance: roundrobin
            port: 8080
            health_check: httpchk GET /health
            health_interval: 5s
            servers:
              - name: web1
                address: 10.0.1.10
                weight: 100
              - name: web2
                address: 10.0.1.11
                weight: 100
              - name: web3
                address: 10.0.1.12
                weight: 100
          api:
            balance: leastconn
            port: 3000
            health_check: httpchk GET /api/health
            health_interval: 10s
            servers:
              - name: api1
                address: 10.0.2.10
                weight: 100
              - name: api2
                address: 10.0.2.11
                weight: 100
        description: HAProxy backend definitions and member servers.
      profile_haproxy_discovery_enabled:
        type: bool
        required: false
        default: false
        description: Whether to derive API backend members from inventory.
      profile_haproxy_discovery_inventory_group:
        type: str
        required: false
        default: app_servers
        description: Inventory group that supplies discovered API backend members.
      profile_haproxy_selinux_enabled:
        type: bool
        required: false
        default: false
        description: Whether to configure the HAProxy SELinux boolean.
      profile_haproxy_stick_table_enabled:
        type: bool
        required: false
        default: false
        description: Whether to render the stick-table configuration fragment.
      profile_haproxy_stick_table_size:
        type: str
        required: false
        default: 100k
        description: HAProxy stick-table size.
      profile_haproxy_stick_table_expire:
        type: str
        required: false
        default: 30m
        description: HAProxy stick-table expiration period.
      profile_haproxy_firewall_provider:
        type: str
        required: false
        default: ufw
        description: "Firewall provider to configure: firewalld, ufw, or none."
      profile_haproxy_firewall_zone:
        type: str
        required: false
        default: public
        description: firewalld zone used for HAProxy port rules.
      profile_haproxy_firewall_ports:
        type: list
        elements: int
        required: false
        description: TCP ports opened for HAProxy.
      stats_user:
        type: str
        required: true
        description: Statistics username injected by the AAP credential type.
      stats_password:
        type: str
        required: true
        description: Sensitive statistics password injected by the AAP credential type.
      ssl_private_key:
        type: str
        required: true
        description: Sensitive TLS private key injected by the AAP credential type.
