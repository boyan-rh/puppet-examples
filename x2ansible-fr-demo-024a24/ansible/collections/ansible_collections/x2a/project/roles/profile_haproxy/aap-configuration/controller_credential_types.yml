---
controller_credential_types:
  - name: Encrypted Hiera HAProxy Statistics Authentication
    description: HAProxy statistics endpoint credentials stored as encrypted Hiera PKCS7 data; migrate to Ansible Vault or an approved external secret manager.
    kind: cloud
    inputs:
      fields:
        - id: stats_user
          type: string
          label: Statistics Username
          help_text: Username used to authenticate to the HAProxy statistics endpoint.
        - id: stats_password
          type: string
          label: Statistics Password
          secret: true
          help_text: Encrypted Hiera PKCS7 password used to authenticate to the HAProxy statistics endpoint.
      required:
        - stats_user
        - stats_password
    injectors:
      extra_vars:
        stats_user: !unsafe "{{ stats_user }}"
        stats_password: !unsafe "{{ stats_password }}"
  - name: Encrypted Hiera HAProxy TLS Private Key
    description: HAProxy TLS private-key material or external secret reference currently represented by an unverified Hiera value; migrate the private key 
      through Ansible Vault or an approved external secret manager.
    kind: cloud
    inputs:
      fields:
        - id: ssl_private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: Private key material for the HAProxy TLS certificate; do not store it in Git or render it without secret-safe task handling.
      required:
        - ssl_private_key
    injectors:
      extra_vars:
        ssl_private_key: !unsafe "{{ ssl_private_key }}"
