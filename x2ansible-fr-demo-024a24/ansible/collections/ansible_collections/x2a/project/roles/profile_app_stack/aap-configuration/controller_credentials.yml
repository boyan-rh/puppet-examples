---
controller_credentials:
  - name: Hiera EYAML PostgreSQL Database - profile_app_stack
    description: PostgreSQL application database credentials sourced from encrypted Hiera EYAML/PKCS7 data and effective plaintext Hiera values; migrate 
      securely to an AAP credential or Ansible Vault-backed input.
    organization: Default
    credential_type: Hiera EYAML PostgreSQL Database
    update_secrets: true
    inputs:
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
      db_name: "{{ db_name }}"
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
  - name: Hiera EYAML Application Secret Key - profile_app_stack
    description: Application secret key sourced from encrypted Hiera EYAML/PKCS7 data and effective plaintext Hiera values; migrate securely to an AAP 
      credential or Ansible Vault-backed input.
    organization: Default
    credential_type: Hiera EYAML Application Secret Key
    update_secrets: true
    inputs:
      secret_key: "{{ vault_secret_key }}"
