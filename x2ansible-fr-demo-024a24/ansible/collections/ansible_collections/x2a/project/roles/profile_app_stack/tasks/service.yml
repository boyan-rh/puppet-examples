---
- name: Render application systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/{{ app_stack_app_name }}.service # noqa: R114 - path is role-defined configuration
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply pending systemd configuration changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start application service
  ansible.builtin.service:
    name: "{{ app_stack_app_name }}" # noqa: R114 - service name is role-defined configuration
    enabled: true
    state: started
