---
controller_credential_types:
  - name: Hiera EYAML PostgreSQL Database
    description: PostgreSQL application database credentials sourced from encrypted Hiera EYAML/PKCS7 data and effective plaintext Hiera values; migrate 
      securely to an AAP credential or Ansible Vault-backed input.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL application database.
        - id: db_port
          type: string
          label: Database Port
          help_text: TCP port for the PostgreSQL application database.
        - id: db_name
          type: string
          label: Database Name
          help_text: Name of the PostgreSQL application database.
        - id: db_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application role; used to create the role and build the secret-bearing database URL.
      required:
        - db_host
        - db_port
        - db_name
        - db_user
        - db_password
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
  - name: Hiera EYAML Application Secret Key
    description: Application secret key sourced from encrypted Hiera EYAML/PKCS7 data and effective plaintext Hiera values; migrate securely to an AAP 
      credential or Ansible Vault-backed input.
    kind: cloud
    inputs:
      fields:
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Secret key used by the test-app runtime configuration.
      required:
        - secret_key
    injectors:
      extra_vars:
        secret_key: !unsafe "{{ secret_key }}"
